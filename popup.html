<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    #url-list {
      white-space: pre-wrap;
      word-break: break-all;
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 8px;
      max-height: 400px;
      overflow-y: auto;
      border-radius: 4px;
    }
    button {
      margin-top: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    #status {
      margin-top: 6px;
      color: green;
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>Open Tabs</h2>
  <div id="url-list"></div>
  <button id="copy-btn">Copy all URLs</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
